  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    environment:
    - TZ=${TIMEZONE}
    volumes:
    - ${DIR_CONFIG}/mosquitto/config:/mosquitto/config:rw
    - ${DIR_CONFIG}/mosquitto/data:/mosquitto/data:rw
    - ${DIR_CONFIG}/mosquitto/log:/mosquitto/log:rw
    logging:
      driver: json-file
      options:
        max-size: "1m"
    networks:
      default:
        ipv4_address: ${IP_MQTT}

  music-assistant:
    container_name: music-assistant
    image: ghcr.io/music-assistant/server:latest
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: ${TIMEZONE}
    volumes:
    - ${DIR_CONFIG}/music-assistant/data:/data
    - ${DIR_MUSIC}:/media/music:ro
    logging:
      driver: json-file
      options:
        max-size: "1m"
    networks:
      default:
        ipv4_address: ${IP_MA}

