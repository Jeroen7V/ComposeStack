networks:
  default:
    external: true
    name: ${NETWORK}

services:
  music-assistant:
    image: ghcr.io/music-assistant/server:latest
    container_name: music-assistant
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: ${TIMEZONE}
    volumes:
      - ${DIR_CONFIG}/music-assistant/data:/data
      - ${DIR_MUSIC}:/media/music:ro
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8095')
      interval: 60s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      default:
        ipv4_address: ${IP_MA}
    labels:
      npm.proxy.domains: ma.int.krokantekrab.be
      npm.proxy.port: "8095"
      npm.proxy.ssl.certificate.id: "8"
    logging:
      driver: json-file
      options:
        max-size: "1m"

  # Markdown -> ESC/POS printer service (EMPS), published at
  # ghcr.io/jeroen7v/emps. USB printer (GDMicroelectronics YC Printer
  # 28e9:0289) is passed through by mapping the whole bus, so replugging
  # the printer (new device node) does not break the setup.
  emps:
    image: ghcr.io/jeroen7v/emps:latest
    container_name: emps
    restart: unless-stopped
    devices:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      TZ: ${TIMEZONE}
      PRINTER_BACKEND: usb
      USB_VENDOR_ID: "0x28e9"
      USB_PRODUCT_ID: "0x0289"
      PAPER_WIDTH_CHARS: "32"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request, sys;
          u = urllib.request.urlopen('http://127.0.0.1:8000/health');
          sys.exit(0 if u.status == 200 else 1)
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
    networks:
      default:
        ipv4_address: ${IP_ESCPOS}
    labels:
      npm.proxy.domains: emps.int.krokantekrab.be
      npm.proxy.port: "8000"
      npm.proxy.ssl.certificate.id: "8"
    logging:
      driver: json-file
      options:
        max-size: "1m"
