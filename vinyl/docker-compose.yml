networks:
  default:
    external: true
    name: ${NETWORK}

services:
  vinyl:
    image: joene/discogssorter:latest
    container_name: vinyl
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000')
      interval: 60s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      default:
        ipv4_address: ${VINYL_IP}
    labels:
      npm.proxy.domains: vinyl.int.krokantekrab.be
      npm.proxy.port: "8000"
      npm.proxy.ssl.certificate.id: "8"
    logging:
      driver: json-file
      options:
        max-size: "1m"
